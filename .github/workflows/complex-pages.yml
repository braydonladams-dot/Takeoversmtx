# Rebuilds the complex pages (lease-takeover/*) from the live listings every 4 hours.
# Only commits when something changed, which then redeploys the site.
name: Update complex pages
on:
  schedule:
    - cron: '17 */4 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/scripts/**', '.github/workflows/complex-pages.yml', 'complex.js']
permissions:
  contents: write
concurrency: complex-pages
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node .github/scripts/build-complex-pages.js
      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Update complex pages"
            git push
          else
            echo "No changes"
          fi
